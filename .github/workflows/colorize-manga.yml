name: Manga kaynaklarını renklendir

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/colorize-manga.yml"
      - "tools/colorize_sources.py"

permissions:
  contents: write

concurrency:
  group: manga-colorize
  cancel-in-progress: true

jobs:
  colorize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Renklendirme modelini kur
        run: |
          python -m pip install --upgrade pip
          pip install pillow gdown torch torchvision opencv-python matplotlib
          git clone --depth 1 https://github.com/qweasdd/manga-colorization-v2.git /tmp/manga-colorization-v2
          mkdir -p /tmp/manga-colorization-v2/networks
          mkdir -p /tmp/manga-colorization-v2/denoising/models
          gdown 1qmxUEKADkEM4iYLp1fpPLLKnfZ6tcF-t -O /tmp/manga-colorization-v2/networks/generator.zip
          gdown 161oyQcYpdkVdw8gKz_MA8RD-Wtg9XDp3 -O /tmp/manga-colorization-v2/denoising/models/net_rgb.pth

      - name: 521 kaynak sayfayı renklendir
        env:
          MANGA_COLORIZER: /tmp/manga-colorization-v2
        run: python tools/colorize_sources.py

      - name: Renkli kaynakları repoya kaydet
        run: |
          git config user.name "ejdermanga-bot"
          git config user.email "actions@users.noreply.github.com"
          git add color-source
          if git diff --cached --quiet; then
            echo "Yeni renkli kaynak yok."
          else
            git commit -m "Mushoku Tensei kaynak sayfalarını renklendir"
            git push
          fi
