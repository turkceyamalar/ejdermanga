<style>

*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Trebuchet MS",Verdana,Arial,sans-serif}button,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}

@keyframes dragon-breathe{from{transform:translateY(2px) rotate(-2deg)}to{transform:translateY(-2px) rotate(2deg)}}
.eyebrow{color:var(--accent2);font-size:.78rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.intro{padding:47px 0 25px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:end;gap:20px}.intro h1{margin:7px 0 0;font:900 clamp(2.2rem,4vw,3.7rem)/1.12 "Arial Narrow","Trebuchet MS",Arial,sans-serif;letter-spacing:.01em}.intro p{color:var(--muted);margin:0 0 5px;max-width:430px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:29px 0 17px}.section-head h2,.chapter-list h2{margin:0;font:900 1.45rem "Arial Narrow","Trebuchet MS",Arial,sans-serif}.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px}.tabs button{background:transparent;color:var(--muted);font-weight:900;border:0;border-radius:6px;padding:8px 15px}.tabs button:hover,.tabs button.active{background:linear-gradient(#ffad63,#e8792a);color:#21150d}.catalog{display:grid;grid-template-columns:minmax(210px,315px) 1fr;min-height:395px;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}.cover-box{background:#2c211d;overflow:hidden}.cover-box img{width:100%;height:100%;object-fit:cover}.cover-fallback{height:100%;min-height:300px;display:grid;place-items:center;padding:20px;color:var(--accent2);text-align:center;font-size:1.5rem}.catalog-body{padding:32px 42px;display:flex;flex-direction:column;align-items:start;justify-content:center}.pill{display:inline-block;background:#f28b3b20;border:1px solid #f28b3b70;color:var(--accent2);border-radius:5px;padding:5px 10px;font-size:.8rem;font-weight:900}.catalog h3{font:900 clamp(2.1rem,4vw,3.5rem)/1.1 "Arial Narrow","Trebuchet MS",Arial,sans-serif;letter-spacing:.01em;margin:16px 0 12px}.catalog p{color:var(--muted);margin:0 0 21px;max-width:590px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 25px}.meta span{color:var(--muted);border:1px solid var(--line);padding:4px 9px;border-radius:5px;font-size:.81rem}.btn{min-height:45px;display:inline-flex;justify-content:center;align-items:center;gap:8px;background:linear-gradient(#ffad63,#e8792a);color:#21150d;border:1px solid #d36a27;border-radius:7px;padding:10px 17px;font-weight:900}.btn:hover{filter:brightness(1.08)}.btn.secondary{background:var(--surface);color:var(--text);border-color:var(--line)}.btn.secondary:hover{background:var(--surface2)}.feature-list{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:22px 0 50px}.feature{padding:18px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}.feature strong{color:var(--accent2)}.feature p{font-size:.87rem;color:var(--muted);margin:5px 0 0}
.crumbs{display:flex;gap:10px;color:var(--muted);margin:30px 0 21px;font-size:.88rem}.crumbs a:hover{color:var(--accent)}.detail{display:grid;grid-template-columns:255px minmax(0,1fr);gap:37px}.detail-cover{aspect-ratio:2/3;border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}.detail-cover img{width:100%;height:100%;object-fit:cover}.detail h1{font:900 clamp(2.2rem,5vw,3.9rem)/1.1 "Arial Narrow","Trebuchet MS",Arial,sans-serif;margin:8px 0 15px}.summary{max-width:700px;color:var(--muted)}.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.chapter-list{margin:35px 0 66px}.chapter-list h2{margin-bottom:14px}.chapter-row{display:flex;justify-content:space-between;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 19px;margin-bottom:8px}.chapter-row:hover{border-color:var(--accent)}.chapter-row small{display:block;color:var(--muted);margin-top:2px}.chapter-row b:last-child{color:var(--accent2)}
.reader-head{position:sticky;top:0;z-index:20;background:var(--nav);border-bottom:1px solid var(--line)}.reader-head-inner{min-height:69px;display:flex;align-items:center;gap:14px}.reader-head .back{color:var(--accent2);font-weight:900;white-space:nowrap}.reader-title{min-width:0;margin-right:auto}.reader-title strong,.reader-title small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reader-title small{font-size:.8rem;color:var(--muted)}.reader-tools{display:flex;align-items:center;gap:7px}.reader-tools select,.reader-tools button{color:var(--text);background:var(--surface);border:1px solid var(--line);padding:8px 10px;border-radius:6px}.reader-tools button:hover{border-color:var(--accent)}.progress{height:3px;background:var(--surface2)}.progress span{display:block;height:100%;background:var(--accent);transition:width .2s}.reader-page{min-height:calc(100vh - 195px);display:flex;align-items:center;flex-direction:column;padding:30px 16px 0}.book-stage{width:min(720px,100%);perspective:1600px;position:relative;cursor:pointer}.book-stage::before,.book-stage::after{position:absolute;top:50%;z-index:2;display:grid;place-items:center;width:38px;height:46px;border-radius:7px;background:#171411b8;color:#fff;font-size:1.5rem;opacity:0;pointer-events:none;transform:translateY(-50%);transition:opacity .18s}.book-stage::before{content:'‹';left:9px}.book-stage::after{content:'›';right:9px}.book-stage:hover::before,.book-stage:hover::after{opacity:.8}.book-sheet{width:100%;transform-style:preserve-3d;transform-origin:left center;box-shadow:var(--shadow);will-change:transform}.book-sheet::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 16px 0 22px #0002,inset -8px 0 18px #0001}.book-sheet.turn-out-next{animation:turn-out-next .28s ease-in forwards;transform-origin:left center}.book-sheet.turn-in-next{animation:turn-in-next .3s ease-out both;transform-origin:right center}.book-sheet.turn-out-prev{animation:turn-out-prev .28s ease-in forwards;transform-origin:right center}.book-sheet.turn-in-prev{animation:turn-in-prev .3s ease-out both;transform-origin:left center}@keyframes turn-out-next{to{transform:rotateY(-88deg)}}@keyframes turn-in-next{from{transform:rotateY(88deg)}to{transform:rotateY(0)}}@keyframes turn-out-prev{to{transform:rotateY(88deg)}}@keyframes turn-in-prev{from{transform:rotateY(-88deg)}to{transform:rotateY(0)}}.manga-image{background:#ece9e3;border:1px solid var(--line)}.manga-image img{width:100%;height:auto}.manga-caption{max-width:600px;text-align:center;color:var(--muted);margin:17px auto 0}.novel-paper{background:var(--paper);color:var(--paper-ink);border:1px solid #a89986;padding:clamp(28px,6vw,68px);font:400 var(--reading-size,18px)/1.9 Georgia,"Times New Roman",serif;min-height:620px}.novel-paper .chapter-label{font:900 .8rem "Trebuchet MS",sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#9d5729}.novel-paper h1{font:700 clamp(1.8rem,4vw,2.7rem)/1.25 Georgia,serif;margin:13px 0 29px}.novel-paper p{margin:0 0 1.3em}.novel-paper p:first-of-type:first-letter{font-size:2.5em;float:left;line-height:.9;margin:6px 7px 0 0;color:#a65d26}.page-controls{display:flex;justify-content:center;align-items:center;gap:10px;padding:24px 16px 52px}.page-controls button{min-width:105px}.page-controls button:disabled{opacity:.42;cursor:not-allowed}.page-indicator{color:var(--muted);min-width:80px;text-align:center}.footer{border-top:1px solid var(--line);padding:22px 0 33px;color:var(--muted);font-size:.83rem}

@media(max-width:390px){.brand-name{font-size:.78rem}.brand-mark{width:42px}.brand-mark img{width:43px}.nav a{padding:0 7px}.catalog{grid-template-columns:100px 1fr}.catalog p{display:none}.catalog h3{font-size:1.3rem}.catalog-body{padding:10px}}

<body><canvas id="background-particles" aria-hidden="true"></canvas><div id="app"></div>
<script>
try{document.documentElement.dataset.theme=localStorage.getItem('ejdermanga-theme')==='light'?'light':'dark'}catch(e){}
const series={slug:'kul-ve-yildiz',title:'Kül ve Yıldız',genre:'Fantastik · Macera',description:'Bir gecede gökten düşen yıldız, unutulmuş bir kulenin kapısını açar. Haritasız yola çıkan Deniz, pusulasının gösterdiği şeyin bir yön değil, geçmişinden kalan bir sır olduğunu öğrenir.',cover:'cover-720.webp',manga:'manga-page.webp'};
const mangaPages=[{src:series.cover,caption:'Bölüm 1 · Kapak'},{src:series.manga,caption:'Yıldızın düştüğü gece, kulenin yolu yeniden açıldı.'}];
const novelPages=[
`<p>Deniz, yıldızın düştüğü geceyi hayatı boyunca unutmayacaktı. Gökyüzü önce sessizce yarılmış, sonra köyün üzerindeki bütün gölgeler bir anlığına ters yöne uzanmıştı.</p><p>Sabah olduğunda tepenin ardında bir kule belirdi. Dün orada yalnızca çam ağaçları vardı.</p><p>“Oraya gitme,” dedi annesi. Sesi, rüzgârın kapıya vurmasından bile alçaktı. Deniz cevap vermedi. Cebindeki eski pusula, yıllardır ilk kez dönüyordu.</p>`,
`<p>Patika yağmurdan kaygandı. Deniz, tepeye tırmanırken pusulanın iğnesinin kuzeyi değil kuleyi gösterdiğini anladı. Her adımda camın altından hafif bir ışık sızıyordu.</p><p>Kulenin kapısında ne kilit vardı ne de tokmak. Taşa oyulmuş tek bir işaret duruyordu: ikiye bölünmüş bir yıldız.</p><p>Deniz elini işarete koydu. Kapı açılmadan önce içeriden bir ses duyuldu. “Sonunda geldin.”</p>`,
`<p>Kapının ardında karanlık bekliyordu; korktuğu kadar soğuk değildi. Duvarlar, sönmeye yüz tutmuş ateşler gibi usulca parlıyordu.</p><p>Deniz içeri adım attığında pusula durdu. İğne artık kuleyi göstermiyordu. Doğrudan onu gösteriyordu.</p><p>O an yıldızın gökten düşmediğini anladı. Birisi onu geri çağırmıştı.</p>`];
const state={filter:'tümü',page:1,font:parseInt(localStorage.getItem('md_font')||'18',10),turning:false,incoming:'',dim:localStorage.getItem('ejdermanga-dim')==='1'};
function head(active=''){return `<header class="site-head"><div class="head-inner"><a class="brand logo-banner" href="#/" aria-label="EjderManga ana sayfa"><img src="assets/ejdermanga-logo.webp" alt="EjderManga" width="500" height="143"></a><nav class="nav" aria-label="Ana menü"><a href="#/" ${active==='home'?'aria-current="page"':''}><span class="nav-icon">⌂</span> ANA SAYFA</a><a href="#/seriler" ${active==='series'?'aria-current="page"':''}>SERİLER</a><a href="#/animeler" ${active==='anime'?'aria-current="page"':''}>ANİMELER</a><button class="theme-toggle" id="themeToggle" aria-label="Görünümü değiştir" title="Açık / koyu görünüm">☼</button></nav></div></header>`}
function footer(){return `<footer class="footer"><div class="wrap">EjderManga · Manga ve novel arşivi</div></footer>`}
function image(path,alt){return `<img src="${path}" ${path===series.cover?'srcset="cover-360.webp 360w, cover-720.webp 720w" sizes="(max-width:390px) 100px, (max-width:720px) 120px, 315px"':''} width="1024" height="1536" decoding="async" alt="${alt}" onerror="this.parentNode.innerHTML='<div class=&quot;cover-fallback&quot;>Kül ve Yıldız</div>'">`}
function home(active='home'){return `${head(active)}<main class="wrap"><div class="intro"><div><div class="eyebrow">Türkçe okuma arşivi</div><h1>Manga ve novel serileri</h1></div><p>Seriyi seç, bölümü aç ve kaldığın sayfadan devam et.</p></div><div class="section-head" id="seriler"><h2>Seriler</h2><div class="tabs" role="group" aria-label="İçerik türü"><button data-filter="tümü" class="${state.filter==='tümü'?'active':''}">Tümü</button><button data-filter="manga" class="${state.filter==='manga'?'active':''}">Manga</button><button data-filter="novel" class="${state.filter==='novel'?'active':''}">Novel</button></div></div><article class="catalog"><div class="cover-box">${image(series.cover,'Kül ve Yıldız özgün kapak illüstrasyonu')}</div><div class="catalog-body"><span class="pill">${state.filter==='manga'?'Manga':state.filter==='novel'?'Novel':'Manga + Novel'}</span><h3>${series.title}</h3><p>${series.description}</p><div class="meta"><span>${series.genre}</span><span>1 bölüm</span><span>Özgün seri</span></div><a class="btn" href="#/seri/${series.slug}">Seriyi aç →</a></div></article><div class="feature-list"><div class="feature"><strong>Sayfa çevirme</strong><p>Manga ve novelde kitabın sayfası gibi geçiş.</p></div><div class="feature"><strong>Telefonda rahat okuma</strong><p>Kaydırarak veya düğmelerle sayfaları değiştir.</p></div><div class="feature"><strong>Kaldığın yer</strong><p>Bu cihazdaki son sayfan hatırlanır.</p></div></div></main>${footer()}`}

function anime(){return `${head('anime')}<main class="wrap"><div class="intro"><div><div class="eyebrow">EjderManga anime arşivi</div><h1>Animeler</h1></div><p>Anime serileri ve bölümleri bu bölümde yer alacak.</p></div><section class="anime-empty" aria-label="Anime arşivi"><span class="pill">Yakında</span><h2>Anime arşivi hazırlanıyor</h2><p>Henüz anime eklenmedi. Yeni içerikler hazır olduğunda burada görebileceksin.</p><a class="btn secondary" href="#/seriler">Manga ve novel serilerine göz at →</a></section></main>${footer()}`}

function reader(type,page){const manga=type==='manga';const total=manga?mangaPages.length:novelPages.length;page=Math.min(total,Math.max(1,page));state.page=page;localStorage.setItem('md_progress',JSON.stringify({...JSON.parse(localStorage.getItem('md_progress')||'{}'),[type]:page}));const incoming=state.incoming;state.incoming='';return `<div class="reader-head"><div class="wrap reader-head-inner"><a class="back" href="#/seri/${series.slug}">← Seri</a><div class="reader-title"><strong>${series.title}</strong><small>${manga?'Manga · Düşen yıldız':'Novel · Kule'}</small></div><div class="reader-tools"><select id="format" aria-label="Okuma türü"><option value="manga" ${manga?'selected':''}>Manga</option><option value="novel" ${!manga?'selected':''}>Novel</option></select>${manga?'':`<button id="fontDown" aria-label="Yazıyı küçült">A−</button><button id="fontUp" aria-label="Yazıyı büyüt">A+</button>`}<button id="dimLight" aria-label="Işığı kıs" aria-pressed="${state.dim}">◐ Işığı kıs</button><button id="fullscreen" aria-label="Tam ekran" aria-pressed="false">⛶ Tam ekran</button></div></div><div class="progress"><span style="width:${page/total*100}%"></span></div></div><main class="reader-page"><div class="book-stage" title="Sol taraf: önceki sayfa · Sağ taraf: sonraki sayfa"><div class="book-sheet ${incoming?'turn-in-'+incoming:''}">${manga?`<div class="manga-image"><img src="${mangaPages[page-1].src}" alt="Kül ve Yıldız manga ${page}. sayfa" width="1024" height="1536" decoding="async"></div>`:`<article class="novel-paper" style="--reading-size:${state.font}px"><div class="chapter-label">Bölüm 1 · Sayfa ${page}</div><h1>Kule</h1>${novelPages[page-1]}</article>`}</div></div>${manga?`<p class="manga-caption">${mangaPages[page-1].caption}</p>`:''}</main><div class="page-controls"><button class="btn secondary" id="prev" ${page===1?'disabled':''}>← Önceki</button><span class="page-indicator">${page} / ${total}</span><button class="btn secondary" id="next" ${page===total?'disabled':''}>Sonraki →</button></div>`}
function baseRender(){let parts=location.hash.replace(/^#\/?/,'').split('/'),view=parts[0],type=parts[1];document.getElementById('app').innerHTML=view==='seri'?detail():view==='oku'&&['manga','novel'].includes(type)?reader(type,Number(parts[2])||1):view==='animeler'?anime():home(view==='seriler'?'series':'home');document.title=(view==='oku'?'Oku · ':view==='seri'?series.title+' · ':view==='animeler'?'Animeler · ':'')+'EjderManga';window.scrollTo(0,0);document.body.classList.toggle('reader-dim',view==='oku'&&state.dim);if(view!=='oku'){document.body.classList.remove('reader-focus');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}if(view==='seriler')requestAnimationFrame(()=>document.getElementById('seriler')?.scrollIntoView());document.getElementById('themeToggle')?.addEventListener('click',toggleTheme);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(tab=>tab.classList.toggle('active',tab.dataset.filter===state.filter));document.querySelector('.catalog .pill').textContent=state.filter==='manga'?'Manga':state.filter==='novel'?'Novel':'Manga + Novel'}));if(view==='oku'){document.querySelector('.book-stage').addEventListener('click',e=>{if(Date.now()-lastSwipeAt<500||window.getSelection()?.toString().trim())return;let box=e.currentTarget.getBoundingClientRect();navigate(state.page+(e.clientX-box.left<box.width/2?-1:1))});document.getElementById('prev').onclick=()=>navigate(state.page-1);document.getElementById('next').onclick=()=>navigate(state.page+1);document.getElementById('format').onchange=e=>location.hash=`#/oku/${e.target.value}/1`;document.getElementById('dimLight').onclick=toggleDim;document.getElementById('fullscreen').onclick=toggleReaderFullscreen;updateReaderControls();for(let [id,delta] of [['fontDown',-2],['fontUp',2]]){let b=document.getElementById(id);if(b)b.onclick=()=>{state.font=Math.max(16,Math.min(28,state.fon function toggleDim(){state.dim=!state.dim;localStorage.setItem('ejdermanga-dim',state.dim?'1':'0');document.body.classList.toggle('reader-dim',state.dim);updateReaderControls()}

function navigate(p){let type=location.hash.split('/')[2],total=type==='manga'?mangaPages.length:novelPages.length;if(p<1||p>total||state.turning)return;let direction=p>state.page?'next':'prev',sheet=document.querySelector('.book-sheet');if(!sheet||matchMedia('(prefers-reduced-motion: reduce)').matches){location.hash=`#/oku/${type}/${p}`;return}state.turning=true;sheet.classList.add('turn-out-'+direction);setTimeout(()=>{state.incoming=direction;state.turning=false;location.hash=`#/oku/${type}/${p}`},260)}
const chapterCache=new Map();let activePageURL=null,loadSequence=0;
async function showChapterPage(ch,page){
 const sequence=++loadSequence,img=document.getElementById('chapterImage'),status=document.getElementById('chapterStatus');
 if(!img)return;
 try{
  let bytes=chapterCache.get(ch);
  if(!bytes){
   const response=await fetch(`${encodeURIComponent(ch)}.zip`);if(!response.ok)throw Error('Bölüm dosyası bulunamadı');
   bytes=new Uint8Array(await response.arrayBuffer());chapterCache.set(ch,bytes);
   while(chapterCache.size>2)chapterCache.delete(chapterCache.keys().next().value);
  }
  if(sequence!==loadSequence||!img.isConnected)return;
  const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),wanted=String(page).padStart(3,'0')+'.webp';let offset=0,found=null;
  while(offset+30<=bytes.length&&view.getUint32(offset,true)===0x04034b50){
   const method=view.getUint16(offset+8,true),size=view.getUint32(offset+18,true),nameLength=view.getUint16(offset+26,true),extraLength=view.getUint16(offset+28,true);
   const name=new TextDecoder().decode(bytes.subarray(offset+30,offset+30+nameLength));const start=offset+30+nameLength+extraLength;
   if(method!==0||start+size>bytes.length)throw Error('Bölüm dosyası okunamadı');
   if(name===wanted){found=bytes.subarray(start,start+size);break}offset=start+size;
  }
  if(!found)throw Error('Sayfa bulunamadı');
  const nextURL=URL.createObjectURL(new Blob([found],{type:'image/webp'}));if(activePageURL)URL.revokeObjectURL(activePageURL);activePageURL=nextURL;
  img.onload=()=>{if(status.isConnected)status.hidden=true};img.onerror=()=>{status.textContent='Görsel yüklenemedi. Sayfayı yenileyebilirsin.'};img.src=nextURL;
 }catch(error){if(sequence===loadSequence&&status.isConnected)status.textContent='Bölüm yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.'}
}

const mushoku=()=>archiveCatalog.find(x=>x.slug==='mushoku-tensei');

 output=output.replace('<article class="catalog">',featured+'<article class="catalog original-series">');
 const cards=`<section class="archive-section"><div class="section-head"><h2>Manga arşivi</h2><label>Ara <input id="catalogSearch" type="search" placeholder="Seri adı…"></label></div><p class="summary">Diğer serilerin bölümleri yakında gelecek.</p><div class="archive-grid">${archiveCatalog.filter(x=>x.slug!=='mushoku-tensei').map(x=>`<a class="archive-card" data-name="${escapeText(x.title.toLocaleLowerCase('tr'))}" href="#/seri/${x.slug}">${coverMarkup(x)}<div><strong>${escapeText(x.title)}</strong><small>Yakında gelecek</small></div></a>`).join('')}</div><p id="searchEmpty" hidden>Bu isimde bir seri bulunamadı.</p></section>`;

function languageSelect(lang){return `<label>Dil <select id="mangaLanguage">${Object.entries(languages).map(([code,name])=>`<option value="${code}" ${code===lang?'selected':''}>${name}${code!=='en'?' · Yakında':''}</option>`).join('')}</select></label>`}
function mangaDetail(slug,lang='en'){
 const item=archiveCatalog.find(x=>x.slug===slug);if(!item)return `${head()}<main class="wrap anime-empty"><h1>Seri bulunamadı</h1><a href="#/">Ana sayfa</a></main>`;
 const ready=slug==='mushoku-tensei';let progress={};try{progress=JSON.parse(localStorage.getItem('mushoku-progress-en')||'{}')}catch{}
 const saved=chapters.find(c=>c.id===progress.chapter);const resume=saved?`#/mushoku/en/${saved.id}/${Math.min(saved.count,Math.max(1,progress.page||1))}`:'#/mushoku/en/1/1';
 return `${head('series')}<main class="wrap"><div class="crumbs"><a href="#/">Ana sayfa</a><span>›</span><span>${escapeText(item.title)}</span></div><section class="detail"><div class="detail-cover">${coverMarkup(item)}</div><div><span class="pill">${ready?'Manga · İngilizce bölümler hazır':'Yakında gelecek'}</span><h1>${escapeText(item.title)}</h1>${ready?`<p class="summary">${chapters.length} bölüm ve ara bölüm · ${chapters.reduce((n,c)=>n+c.count,0)} sayfa</p>${languageSelect(lang)}<div class="detail-actions">${lang==='en'?`<a class="btn" href="#/mushoku/en/1/1">İlk bölümden oku</a>${saved?`<a class="btn secondary" href="${resume}">Kaldığın yerden devam et</a>`:''}`:`<p class="summary">${languages[lang]} çevirisi yakında gelecek. Şu anda İngilizce bölümleri okuyabilirsin.</p><a class="btn" href="#/seri/mushoku-tensei/en">İngilizce bölümleri göster</a>`}</div>`:'<p class="summary">Bu serinin bölümleri yakında gelecek.</p><a class="btn secondary" href="#/seriler">Serilere dön</a>'}</div></section>${ready&&lang==='en'?`<section class="chapter-list"><h2>Bölümler</h2><p class="summary">27. bölüm kaynak arşivde bulunmuyor; bu numarada yalnızca bilgilendirme görseli var.</p>${chapters.map(c=>`<a class="chapter-row" href="#/mushoku/en/${c.id}/1"><span><strong>Bölüm ${c.id}</strong><small>${c.count} sayfa · İngilizce</small></span><b>Oku →</b></a>`).join('')}</section>`:''}</main>${footer()}`;

function mangaReader(lang,ch,p){
 if(lang!=='en')return mangaDetail('mushoku-tensei',languages[lang]?lang:'en');
 const chapter=chapters.find(c=>c.id===ch);if(!chapter)return mangaDetail('mushoku-tensei');
 p=Math.max(1,Math.min(chapter.count,parseInt(p)||1));state.page=p;localStorage.setItem('mushoku-progress-en',JSON.stringify({chapter:ch,page:p}));
 const index=chapters.indexOf(chapter),src=`mushoku/en/${ch}/${String(p).padStart(3,'0')}.webp`;
 return `<div class="reader-head"><div class="wrap reader-head-inner"><a class="back" href="#/seri/mushoku-tensei">← Bölümler</a><div class="reader-title"><strong>Mushoku Tensei</strong><small>Bölüm ${ch} · İngilizce</small></div><div class="reader-tools"><select id="chapterSelect" aria-label="Bölüm seç">${chapters.map(c=>`<option value="${c.id}" ${ch===c.id?'selected':''}>Bölüm ${c.id}</option>`).join('')}</select><button id="dimLight">◐ Işığı kıs</button><button id="fullscreen">⛶ Tam ekran</button></div></div><div class="progress"><span style="width:${p/chapter.count*100}%"></span></div></div><main class="reader-page"><div class="book-stage" title="Sol: önceki · Sağ: sonraki"><div class="book-sheet"><div class="manga-image"><p id="chapterStatus" role="status">Bölüm yükleniyor…</p><img id="chapterImage" alt="Mushoku Tensei, bölüm ${ch}, sayfa ${p}" decoding="async"></div></div></div></main><div class="page-controls"><button id="prev" class="btn secondary" ${p===1&&index===0?'disabled':''}>← Önceki</button><span class="page-indicator">${p} / ${chapter.count}<br><small>%${Math.round(p/chapter.count*100)}</small></span><button id="next" class="btn secondary" ${p===chapter.count&&index===chapters.length-1?'disabled':''}>Sonraki →</button></div>`;
}
const originalNavigate=navigate;
navigate=function(p){
 if(!location.hash.startsWith('#/mushoku/'))return originalNavigate(p);
 const parts=location.hash.split('/'),chapter=chapters.find(c=>c.id===parts[3]);if(!chapter||state.turning)return;
 let idx=chapters.indexOf(chapter),target=chapter;
 if(p<1){target=chapters[idx-1];if(!target)return;p=target.count}
 if(p>chapter.count){target=chapters[idx+1];if(!target)return;p=1}
 const targetHash=`#/mushoku/en/${target.id}/${p}`;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){location.hash=targetHash;return}
 state.turning=true;document.querySelector('.book-sheet')?.classList.add(p>state.page?'turn-out-next':'turn-out-prev');
 setTimeout(()=>{state.turning=false;location.hash=targetHash},260);
};
function render(){
 const parts=location.hash.replace(/^#\/?/,'').split('/');const [view,slug]=parts;
 if(view==='mushoku'||view==='seri'&&slug!=='kul-ve-yildiz'){
  const reading=view==='mushoku'&&slug==='en'&&chapters.some(c=>c.id===parts[2]);
  document.getElementById('app').innerHTML=view==='mushoku'?mangaReader(slug,parts[2],parts[3]):mangaDetail(slug,languages[parts[2]]?parts[2]:'en');
  document.title=(reading?'Oku · Mushoku Tensei':archiveCatalog.find(x=>x.slug===slug)?.title||'Mushoku Tensei')+' · EjderManga';
  document.body.classList.toggle('reader-dim',reading&&state.dim);
  if(!reading){document.body.classList.remove('reader-focus');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
  window.scrollTo(0,0);document.getElementById('themeToggle')?.addEventListener('click',toggleTheme);
  document.getElementById('mangaLanguage')?.addEventListener('change',e=>location.hash='#/seri/mushoku-tensei/'+e.target.value);
  if(reading){
   document.getElementById('prev').onclick=()=>navigate(state.page-1);document.getElementById('next').onclick=()=>navigate(state.page+1);
   document.getElementById('chapterSelect').onchange=e=>location.hash=`#/mushoku/en/${e.target.value}/1`;
   document.getElementById('dimLight').onclick=toggleDim;document.getElementById('fullscreen').onclick=toggleReaderFullscreen;
   document.querySelector('.book-stage').onclick=e=>{if(Date.now()-lastSwipeAt<500)return;const box=e.currentTarget.getBoundingClientRect();navigate(state.page+(e.clientX-box.left<box.width/2?-1:1))};
   updateReaderControls();showChapterPage(parts[2],state.page);
  }
 }else{
  baseRender();
  const applyFilter=()=>{document.querySelectorAll('.new-feature,.archive-section').forEach(e=>e.hidden=state.filter==='novel')};applyFilter();document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',applyFilter));
  document.getElementById('catalogSearch')?.addEventListener('input',e=>{let count=0;document.querySelectorAll('.archive-card').forEach(c=>{c.hidden=!c.dataset.name.includes(e.target.value.toLocaleLowerCase('tr'));if(!c.hidden)count++});document.getElementById('searchEmpty').hidden=!!count});
 }
}
window.addEventListener('keydown',e=>{
 if(e.key==='Escape'){document.body.classList.remove('reader-focus');updateReaderControls()}
 if(!location.hash.startsWith('#/mushoku/')||e.target.closest('select,button,input'))return;
 if(e.key==='ArrowRight'){e.preventDefault();navigate(state.page+1)}if(e.key==='ArrowLeft'){e.preventDefault();navigate(state.page-1)}
});
let mangaTouch=null;
window.addEventListener('touchstart',e=>{mangaTouch=e.target.closest('.book-stage')?{x:e.changedTouches[0].screenX,y:e.changedTouches[0].screenY}:null},{passive:true});
window.addEventListener('touchend',e=>{if(!mangaTouch||!location.hash.startsWith('#/mushoku/'))return;const dx=e.changedTouches[0].screenX-mangaTouch.x,dy=e.changedTouches[0].screenY-mangaTouch.y;mangaTouch=null;if(Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy)){lastSwipeAt=Date.now();navigate(state.page+(dx<0?1:-1))}},{passive:true});

window.addEventListener('hashchange',render);window.addEventListener('keydown',e=>{if(!location.hash.startsWith('#/oku/')||e.target.closest('select,button,input'))return;if(e.key==='ArrowRight')navigate(state.page+1);if(e.key==='ArrowLeft')navigate(state.page-1)});let touchX=0,lastSwipeAt=0;window.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});window.addEventListener('touchend',e=>{if(!location.hash.startsWith('#/oku/'))return;let d=e.changedTouches[0].screenX-touchX;if(Math.abs(d)>90){lastSwipeAt=Date.now();navigate(state.page+(d<0?1:-1))}},{passive:true});render();

/* Lightweight canvas particles, capped at 30 fps and paused off-screen. */
(function backgroundParticles(){
 const canvas=document.getElementById('background-particles'),ctx=canvas.getContext('2d');
 if(!ctx)return;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 let width=0,height=0,points=[],frame=0,last=0;
 function resize(){
  width=innerWidth;height=innerHeight;
  const ratio=Math.min(devicePixelRatio||1,1.5);
  canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);
  ctx.setTransform(ratio,0,0,ratio,0,0);
  const count=Math.min(115,Math.max(24,Math.round(width*height/16000)));
  points=Array.from({length:count},()=>({x:Math.random()*width,y:Math.random()*height,r:.7+Math.random()*1.8,a:.22+Math.random()*.42,vx:(Math.random()-.5)*.16,vy:-.09-Math.random()*.17}));
  draw(0);
 }
 function draw(step){
  ctx.clearRect(0,0,width,height);
  const light=document.documentElement.dataset.theme==='light';
  for(const point of points){
   point.x+=point.vx*step;point.y+=point.vy*step;
   if(point.y<-4)point.y=height+4;
   if(point.x<-4)point.x=width+4;
   if(point.x>width+4)point.x=-4;
