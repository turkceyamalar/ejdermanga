name: Manga çevirileri üret

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/translate-manga.yml"
      - "tools/translate_chapters.py"
      - "color-source/**.zip"

permissions:
  contents: write

concurrency:
  group: manga-translate
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core fonts-noto-core fonts-noto-cjk libfribidi0 libraqm0

      - name: Python paketleri
        run: |
          python -m pip install --upgrade pip
          pip install pillow pytesseract argostranslate

      - name: Tüm bölümleri çevir
        run: python tools/translate_chapters.py

      - name: Çevirileri repoya kaydet
        run: |
          git config user.name "ejdermanga-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tr fr it ar es ja
          if git diff --cached --quiet; then
            echo "Yeni çeviri yok."
          else
            git commit -m "Mushoku Tensei bölümlerini 6 dile çevir"
            git push
          fi
