name: Tam Türkçe Bölüm 1'i yayınla

on:
  push:
    paths:
      - "tmp/tr-mit-1/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Base64 parçalarını ZIP'e çevir
        run: |
          mkdir -p tr-mit
          cat tmp/tr-mit-1/part-*.txt | tr -d '\n\r ' | base64 -d > tr-mit/1.zip
      - name: Paketi doğrula
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("tr-mit/1.zip") as z:
              names=sorted(n for n in z.namelist() if n.endswith(".webp"))
              assert names == [f"{i:03d}.webp" for i in range(1,11)], names
              for n in names:
                  assert z.getinfo(n).compress_type == zipfile.ZIP_STORED
          print("Tam Türkçe ilk 10 sayfa doğrulandı.")
          PY
      - name: Siteye kaydet
        run: |
          git config user.name "ejdermanga-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tr-mit/1.zip
          git commit -m "Bölüm 1 ilk 10 tam Türkçe sayfayı yayınla" || exit 0
          git push origin HEAD:main
