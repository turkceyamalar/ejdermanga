name: Önce Türkçe mangayı üret

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/translate-tr.yml"

permissions:
  contents: write

concurrency:
  group: manga-translate-tr
  cancel-in-progress: true

jobs:
  translate_tr:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core fonts-noto-core fonts-noto-cjk libfribidi0 libraqm0

      - name: Python paketleri
        run: |
          python -m pip install --upgrade pip
          pip install pillow pytesseract argostranslate

      - name: Sadece Türkçeyi üret
        env:
          TARGET_LANGS: tr
        run: python tools/translate_chapters.py

      - name: Türkçe paketleri repoya kaydet
        run: |
          git config user.name "ejdermanga-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tr
          if git diff --cached --quiet; then
            echo "Yeni Türkçe paket yok."
          else
            git commit -m "Mushoku Tensei Türkçe manga paketlerini üret"
            git push
          fi
