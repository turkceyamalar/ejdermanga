.featured-anime-arrows button{width:38px;height:38px;border:1px solid #ffffff3a;border-radius:7px;background:#ffffff10;color:#fff;font-size:1.5rem;display:grid;place-items:center}
.featured-anime-arrows button:hover{background:#ffffff20}
.featured-anime-track{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding-bottom:4px}
.featured-anime-track::-webkit-scrollbar{display:none}
.featured-anime-card{flex:0 0 160px;min-width:0}
.featured-anime-card .anime-poster-art{aspect-ratio:2/3;border-radius:9px;overflow:hidden;border:1px solid #ffffff22;background:#24110a}
.featured-anime-card strong,.featured-anime-card small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.featured-anime-card strong{margin-top:8px;font-size:.9rem}
.featured-anime-card small{color:#d4b4a5;font-size:.75rem;margin-top:2px}
@media(max-width:760px){.featured-anime-panel{padding:20px 18px}.featured-anime-head h2{font-size:1.45rem}.featured-anime-card{flex-basis:135px}}

.anime-hero{position:relative;width:min(1500px,calc(100vw - 18px));height:clamp(430px,56vw,650px);margin:18px 50% 36px;transform:translateX(-50%);overflow:hidden;border-radius:14px;border:1px solid var(--line);background:#0b0b0b;box-shadow:0 22px 50px #0007}
.anime-hero-slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .55s ease;background-image:var(--hero-bg),linear-gradient(135deg,#191919,#080808);background-size:cover;background-position:center 28%;background-repeat:no-repeat}
.anime-hero-slide.active{opacity:1;pointer-events:auto}
.anime-hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,5,9,.92) 0%,rgba(4,5,8,.72) 32%,rgba(4,4,5,.25) 62%,rgba(2,2,2,.18) 100%),linear-gradient(0deg,rgba(8,8,9,.95) 0%,transparent 45%)}
.anime-hero-content{position:absolute;left:clamp(26px,5vw,78px);top:50%;transform:translateY(-46%);width:min(760px,68%);z-index:2}
.anime-hero-tag{display:inline-flex;padding:6px 11px;border-radius:999px;background:#16856ddd;border:1px solid #8ce9d0;color:#fff;font-weight:900;font-size:.8rem}
.anime-hero-content h1{margin:12px 0 8px;font:900 clamp(2.5rem,5vw,5rem)/1 "Arial Narrow","Trebuchet MS",Arial,sans-serif;color:#fff;text-shadow:0 3px 18px #000}
.anime-hero-content p{font-size:clamp(1rem,1.6vw,1.35rem);line-height:1.55;color:#fff;max-width:760px;text-shadow:0 2px 8px #000;margin:0 0 10px}
.anime-hero-content>strong{display:block;color:#ffd400;font-size:1rem;margin-top:8px}
.anime-hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.anime-hero-dots{position:absolute;z-index:3;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px}
.anime-hero-dots button{width:26px;height:4px;padding:0;border:0;border-radius:99px;background:#ffffff33}.anime-hero-dots button.active{background:#168dff}
.anime-hero-nav{position:absolute;z-index:3;right:22px;bottom:18px;display:flex;gap:7px}
.anime-hero-nav button{width:38px;height:38px;border:1px solid #ffffff44;border-radius:7px;background:#1119;color:white;font-size:1.45rem}
.anime-hero-nav button:hover{background:#222d}
@media(max-width:760px){.anime-hero{height:520px;border-radius:10px}.anime-hero-content{width:82%;left:24px;top:auto;bottom:58px;transform:none}.anime-hero-shade{background:linear-gradient(0deg,rgba(3,4,7,.97) 5%,rgba(3,4,7,.62) 65%,rgba(3,4,7,.12) 100%)}.anime-hero-content p{font-size:.95rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.anime-hero-content h1{font-size:2.5rem}.anime-hero-nav{display:none}}

`<p>Patika yağmurdan kaygandı. Deniz, tepeye tırmanırken pusulanın iğnesinin kuzeyi değil kuleyi gösterdiğini anladı. Her adımda camın altından hafif bir ışık sızıyordu.</p><p>Kulenin kapısında ne kilit vardı ne de tokmak. Taşa oyulmuş tek bir işaret duruyordu: ikiye bölünmüş bir yıldız.</p><p>Deniz elini işarete koydu. Kapı açılmadan önce içeriden bir ses duyuldu. “Sonunda geldin.”</p>`,
`<p>Kapının ardında karanlık bekliyordu; korktuğu kadar soğuk değildi. Duvarlar, sönmeye yüz tutmuş ateşler gibi usulca parlıyordu.</p><p>Deniz içeri adım attığında pusula durdu. İğne artık kuleyi göstermiyordu. Doğrudan onu gösteriyordu.</p><p>O an yıldızın gökten düşmediğini anladı. Birisi onu geri çağırmıştı.</p>`];

async function hydrateAnimePosters(){

const chapterCache=new Map();let activePageURL=null,loadSequence=0;
async function showChapterPage(lang,ch,page){
 const sequence=++loadSequence,img=document.getElementById('chapterImage'),status=document.getElementById('chapterStatus');
 if(!img)return;
 try{
  const cacheKey=lang+':'+ch;let bytes=chapterCache.get(cacheKey);
  if(!bytes){
   let response=await fetch(`${encodeURIComponent(lang)}/${encodeURIComponent(ch)}.zip`);let fallback=false;if(!response.ok){fallback=true;response=await fetch(`${encodeURIComponent(ch)}.zip`)}if(!response.ok)throw Error('Bölüm dosyası bulunamadı');if(fallback){if(status)status.textContent=`${languages[lang]} paketi hazırlanıyor · şu an İngilizce sayfa gösteriliyor`;const lbl=document.getElementById('readerLangLabel');if(lbl)lbl.textContent=`Bölüm ${ch} · İngilizce · ${languages[lang]} hazırlanıyor`;}else{const lbl=document.getElementById('readerLangLabel');if(lbl)lbl.textContent=`Bölüm ${ch} · ${languages[lang]}`;}
   bytes=new Uint8Array(await response.arrayBuffer());chapterCache.set(cacheKey,bytes);
   while(chapterCache.size>2)chapterCache.delete(chapterCache.keys().next().value);
  }
  if(sequence!==loadSequence||!img.isConnected)return;
  const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),wanted=String(page).padStart(3,'0')+'.webp';let offset=0,found=null;
  while(offset+30<=bytes.length&&view.getUint32(offset,true)===0x04034b50){
   const method=view.getUint16(offset+8,true),size=view.getUint32(offset+18,true),nameLength=view.getUint16(offset+26,true),extraLength=view.getUint16(offset+28,true);
   const name=new TextDecoder().decode(bytes.subarray(offset+30,offset+30+nameLength));const start=offset+30+nameLength+extraLength;
   if(method!==0||start+size>bytes.length)throw Error('Bölüm dosyası okunamadı');
   if(name===wanted){found=bytes.subarray(start,start+size);break}offset=start+size;
  }
  if(!found)throw Error('Sayfa bulunamadı');
  const nextURL=URL.createObjectURL(new Blob([found],{type:'image/webp'}));if(activePageURL)URL.revokeObjectURL(activePageURL);activePageURL=nextURL;
  img.onload=()=>{if(status.isConnected)status.hidden=true};img.onerror=()=>{status.textContent='Görsel yüklenemedi. Sayfayı yenileyebilirsin.'};img.src=nextURL;
 }catch(error){if(sequence===loadSequence&&status.isConnected)status.textContent='Bölüm yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.'}
}

  return '<article class="anime-hero-slide '+(i===0?'active':'')+'" data-hero-index="'+i+'" style="--hero-bg:url(\''+x.bg+'\')"><div class="anime-hero-shade"></div><div class="anime-hero-content"><span class="anime-hero-tag">'+escapeText(x.tag)+'</span><h1>'+escapeText(x.title)+'</h1><p>'+escapeText(x.desc)+'</p><strong>'+escapeText(x.genre)+'</strong><div class="anime-hero-actions"><a class="btn" href="#/anime/'+x.slug+'">Animeyi aç →</a><a class="btn secondary" href="#/animeler">Tüm animeler</a></div></div></article>';
 }).join('');
 var dots=homeHeroSlides.map(function(_,i){return '<button type="button" class="'+(i===0?'active':'')+'" data-hero-dot="'+i+'" aria-label="Slayt '+(i+1)+'"></button>'}).join('');
 return '<section class="anime-hero" aria-label="Öne çıkan animeler">'+slides+'<div class="anime-hero-dots">'+dots+'</div><div class="anime-hero-nav"><button type="button" id="heroPrev" aria-label="Önceki">‹</button><button type="button" id="heroNext" aria-label="Sonraki">›</button></div></section>';
}
let heroTimer=null;
function bindHomeHero(){
 var hero=document.querySelector('.anime-hero');if(!hero)return;
 var slides=[...hero.querySelectorAll('.anime-hero-slide')],dots=[...hero.querySelectorAll('[data-hero-dot]')];if(!slides.length)return;
 var current=0;
 function show(n){current=(n+slides.length)%slides.length;slides.forEach(function(s,i){s.classList.toggle('active',i===current)});dots.forEach(function(d,i){d.classList.toggle('active',i===current)})}
 function restart(){if(heroTimer)clearInterval(heroTimer);heroTimer=setInterval(function(){show(current+1)},6500)}
 dots.forEach(function(d){d.onclick=function(){show(parseInt(d.dataset.heroDot,10));restart()}});
 var prev=document.getElementById('heroPrev'),next=document.getElementById('heroNext');if(prev)prev.onclick=function(){show(current-1);restart()};if(next)next.onclick=function(){show(current+1);restart()};
 restart();
}
const homeTopRated=[
 ['steel-ball-run','9.5'],['attack-on-titan','9.1'],['fullmetal-alchemist-brotherhood','9.1'],['bleach-tybw','9.0'],['one-piece','9.0'],['hunter-x-hunter','9.0'],['death-note','8.9']
];
const homeNewAnime=[
 ['steel-ball-run','Yeni bölümler'],['black-clover','2. Sezon'],['blue-box-s2','2. Sezon'],['tokyo-revengers-santen','Yeni sezon'],['hotaru-no-yomeiri','2026 Sonbahar'],['aoashi-s2','2. Sezon'],['dragon-ball-super-beerus','2026 Sonbahar'],['tank-chair','2026 Sonbahar']
];
function homeAnimeStrip(title,rows,badge){
 const latest=title==='Son Çıkan Animeler';
 const panelId=latest?'latestAnimePanel':'ratedAnimePanel';
 const cards=rows.map(function(row){
  var x=animeCatalog.find(function(a){return a.slug===row[0]});
  if(!x)return '';
  return '<a class="featured-anime-card" href="#/anime/'+x.slug+'">'+animePoster(x,false)+'<strong>'+escapeText(x.short)+'</strong><small>'+escapeText(row[1])+'</small></a>';
 }).join('');
 return '<section class="featured-anime-panel '+(latest?'latest-panel':'rated-panel')+'">'+
 '<div class="featured-anime-head"><div><span class="featured-anime-badge">'+(latest?'✦ EjderManga’da Sonbahar Sezonu':'★ IMDb puanlarına göre')+'</span><h2>'+title+'</h2></div>'+
 '<div class="featured-anime-arrows"><button type="button" data-scroll-target="'+panelId+'" data-dir="-1" aria-label="Önceki">‹</button><button type="button" data-scroll-target="'+panelId+'" data-dir="1" aria-label="Sonraki">›</button></div></div>'+
 '<div class="featured-anime-track" id="'+panelId+'">'+cards+'</div></section>';
}
function bindFeaturedAnimeScroll(){
 document.querySelectorAll('[data-scroll-target]').forEach(function(btn){
  btn.onclick=function(){
   var el=document.getElementById(btn.dataset.scrollTarget);
   if(!el)return;
   el.scrollBy({left:parseInt(btn.dataset.dir||'1',10)*Math.max(300,el.clientWidth*.78),behavior:'smooth'});
  };
 });
}
function homeAnimeSections(){
 return homeAnimeStrip('IMDb’de En Yüksek Puanlı Animeler',homeTopRated,'IMDb')+homeAnimeStrip('Son Çıkan Animeler',homeNewAnime,'Durum');
}

function languageSelect(lang){return `<label>Dil <select id="mangaLanguage">${Object.entries(languages).map(([code,name])=>`<option value="${code}" ${code===lang?'selected':''}>${name}</option>`).join('')}</select></label>`}
function mangaDetail(slug,lang='tr'){
 const item=archiveCatalog.find(x=>x.slug===slug);if(!item)return `${head()}<main class="wrap anime-empty"><h1>Seri bulunamadı</h1><a href="#/">Ana sayfa</a></main>`;
 const ready=slug==='mushoku-tensei';lang=languages[lang]?lang:'tr';let progress={};try{progress=JSON.parse(localStorage.getItem('mushoku-progress-'+lang)||'{}')}catch{}
 const saved=chapters.find(c=>c.id===progress.chapter);const resume=saved?`#/mushoku/${lang}/${saved.id}/${Math.min(saved.count,Math.max(1,progress.page||1))}`:`#/mushoku/${lang}/1/1`;
 return `${head('series')}<main class="wrap"><div class="crumbs"><a href="#/">Ana sayfa</a><span>›</span><span>${escapeText(item.title)}</span></div><section class="detail"><div class="detail-cover">${coverMarkup(item)}</div><div><span class="pill">${ready?'Manga · Çok dilli okuyucu':'Yakında gelecek'}</span><h1>${escapeText(item.title)}</h1>${ready?`<p class="summary">${chapters.length} bölüm ve ara bölüm · ${chapters.reduce((n,c)=>n+c.count,0)} sayfa</p>${languageSelect(lang)}<div class="detail-actions"><a class="btn" href="#/mushoku/${lang}/1/1">İlk bölümden oku</a>${saved?`<a class="btn secondary" href="${resume}">Kaldığın yerden devam et</a>`:''}</div><p class="summary">Seçili dil: <strong>${languages[lang]}</strong>. Çeviri paketi henüz oluşmadıysa okuyucu geçici olarak İngilizce sayfayı gösterir; paket hazır olduğunda aynı bağlantı otomatik çeviriyi açar.</p>`:'<p class="summary">Bu serinin bölümleri yakında gelecek.</p><a class="btn secondary" href="#/seriler">Serilere dön</a>'}</div></section>${ready?`<section class="chapter-list"><h2>Bölümler</h2>${chapters.map(c=>`<a class="chapter-row" href="#/mushoku/${lang}/${c.id}/1"><span><strong>Bölüm ${c.id}</strong><small>${c.count} sayfa · ${languages[lang]}</small></span><b>Oku →</b></a>`).join('')}</section>`:''}</main>${footer()}`;
}
function mangaReader(lang,ch,p){
 lang=languages[lang]?lang:'tr';
 const chapter=chapters.find(c=>c.id===ch);if(!chapter)return mangaDetail('mushoku-tensei');
 p=Math.max(1,Math.min(chapter.count,parseInt(p)||1));state.page=p;localStorage.setItem('mushoku-progress-'+lang,JSON.stringify({chapter:ch,page:p}));
 const index=chapters.indexOf(chapter),src=`mushoku/en/${ch}/${String(p).padStart(3,'0')}.webp`;
 return `<div class="reader-head"><div class="wrap reader-head-inner"><a class="back" href="#/seri/mushoku-tensei">← Bölümler</a><div class="reader-title"><strong>Mushoku Tensei</strong><small id="readerLangLabel">Bölüm ${ch} · ${languages[lang]}</small></div><div class="reader-tools"><select id="chapterSelect" aria-label="Bölüm seç">${chapters.map(c=>`<option value="${c.id}" ${ch===c.id?'selected':''}>Bölüm ${c.id}</option>`).join('')}</select><button id="dimLight">◐ Işığı kıs</button><button id="fullscreen">⛶ Tam ekran</button></div></div><div class="progress"><span style="width:${p/chapter.count*100}%"></span></div></div><main class="reader-page"><div class="book-stage" title="Sol: önceki · Sağ: sonraki"><div class="book-sheet"><div class="manga-image"><p id="chapterStatus" role="status">Bölüm yükleniyor…</p><img id="chapterImage" alt="Mushoku Tensei, bölüm ${ch}, sayfa ${p}" decoding="async"></div></div></div></main><div class="page-controls"><button id="prev" class="btn secondary" ${p===1&&index===0?'disabled':''}>← Önceki</button><span class="page-indicator">${p} / ${chapter.count}<br><small>%${Math.round(p/chapter.count*100)}</small></span><button id="next" class="btn secondary" ${p===chapter.count&&index===chapters.length-1?'disabled':''}>Sonraki →</button></div>`;
}
const originalNavigate=navigate;
navigate=function(p){
 if(!location.hash.startsWith('#/mushoku/'))return originalNavigate(p);
 const parts=location.hash.split('/'),chapter=chapters.find(c=>c.id===parts[3]);if(!chapter||state.turning)return;
 let idx=chapters.indexOf(chapter),target=chapter;
 if(p<1){target=chapters[idx-1];if(!target)return;p=target.count}
 if(p>chapter.count){target=chapters[idx+1];if(!target)return;p=1}
 const lang=parts[2],targetHash=`#/mushoku/${lang}/${target.id}/${p}`;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){location.hash=targetHash;return}
 state.turning=true;document.querySelector('.book-sheet')?.classList.add(p>state.page?'turn-out-next':'turn-out-prev');
 setTimeout(()=>{state.turning=false;location.hash=targetHash},260);
};
function render(){
 const parts=location.hash.replace(/^#\/?/,'').split('/');const [view,slug]=parts;
 if(view==='mushoku'||view==='seri'&&slug!=='kul-ve-yildiz'){
  const reading=view==='mushoku'&&!!languages[slug]&&chapters.some(c=>c.id===parts[2]);
  document.getElementById('app').innerHTML=view==='mushoku'?mangaReader(slug,parts[2],parts[3]):mangaDetail(slug,languages[parts[2]]?parts[2]:'tr');
  document.title=(reading?'Oku · Mushoku Tensei':archiveCatalog.find(x=>x.slug===slug)?.title||'Mushoku Tensei')+' · EjderManga';
  document.body.classList.toggle('reader-dim',reading&&state.dim);
  if(!reading){document.body.classList.remove('reader-focus');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
  window.scrollTo(0,0);document.getElementById('themeToggle')?.addEventListener('click',toggleTheme);bindFeaturedAnimeScroll();
  document.getElementById('mangaLanguage')?.addEventListener('change',e=>location.hash='#/seri/mushoku-tensei/'+e.target.value);
  if(reading){
   document.getElementById('prev').onclick=()=>navigate(state.page-1);document.getElementById('next').onclick=()=>navigate(state.page+1);
   document.getElementById('chapterSelect').onchange=e=>location.hash=`#/mushoku/${slug}/${e.target.value}/1`;
   document.getElementById('dimLight').onclick=toggleDim;document.getElementById('fullscreen').onclick=toggleReaderFullscreen;
   document.querySelector('.book-stage').onclick=e=>{if(Date.now()-lastSwipeAt<500)return;const box=e.currentTarget.getBoundingClientRect();navigate(state.page+(e.clientX-box.left<box.width/2?-1:1))};
   updateReaderControls();showChapterPage(slug,parts[2],state.page);
  }
 }else{
  baseRender();
  const applyFilter=()=>{document.querySelectorAll('.new-feature,.archive-section').forEach(e=>e.hidden=state.filter==='novel')};applyFilter();document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',applyFilter));
  document.getElementById('catalogSearch')?.addEventListener('input',e=>{let count=0;document.querySelectorAll('.archive-card').forEach(c=>{c.hidden=!c.dataset.name.includes(e.target.value.toLocaleLowerCase('tr'));if(!c.hidden)count++});document.getElementById('searchEmpty').hidden=!!count});
 }
}
window.addEventListener('keydown',e=>{
 if(e.key==='Escape'){document.body.classList.remove('reader-focus');updateReaderControls()}
 if(!location.hash.startsWith('#/mushoku/')||e.target.closest('select,button,input'))return;
 if(e.key==='ArrowRight'){e.preventDefault();navigate(state.page+1)}if(e.key==='ArrowLeft'){e.preventDefault();navigate(state.page-1)}
});
let mangaTouch=null;
window.addEventListener('touchstart',e=>{mangaTouch=e.target.closest('.book-stage')?{x:e.changedTouches[0].screenX,y:e.changedTouches[0].screenY}:null},{passive:true});
window.addEventListener('touchend',e=>{if(!mangaTouch||!location.hash.startsWith('#/mushoku/'))return;const dx=e.changedTouches[0].screenX-mangaTouch.x,dy=e.changedTouches[0].screenY-mangaTouch.y;mangaTouch=null;if(Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy)){lastSwipeAt=Date.now();navigate(state.page+(dx<0?1:-1))}},{passive:true});

window.addEventListener('hashchange',render);window.addEventListener('keydown',e=>{if(!location.hash.startsWith('#/oku/')||e.target.closest('select,button,input'))return;if(e.key==='ArrowRight')navigate(state.page+1);if(e.key==='ArrowLeft')navigate(state.page-1)});let touchX=0,lastSwipeAt=0;window.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});window.addEventListener('touchend',e=>{if(!location.hash.startsWith('#/oku/'))return;let d=e.changedTouches[0].screenX-touchX;if(Math.abs(d)>90){lastSwipeAt=Date.now();navigate(state.page+(d<0?1:-1))}},{passive:true});render();

/* Lightweight canvas particles, capped at 30 fps and paused off-screen. */
(function backgroundParticles(){
 const canvas=document.getElementById('background-particles'),ctx=canvas.getContext('2d');
 if(!ctx)return;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 let width=0,height=0,points=[],frame=0,last=0;
 function resize(){
  width=innerWidth;height=innerHeight;
  const ratio=Math.min(devicePixelRatio||1,1.5);
  canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);
  ctx.setTransform(ratio,0,0,ratio,0,0);
  const count=Math.min(115,Math.max(24,Math.round(width*height/16000)));
  points=Array.from({length:count},()=>({x:Math.random()*width,y:Math.random()*height,r:.7+Math.random()*1.8,a:.22+Math.random()*.42,vx:(Math.random()-.5)*.16,vy:-.09-Math.random()*.17}));
  draw(0);
 }
 function draw(step){
  ctx.clearRect(0,0,width,height);
  const light=document.documentElement.dataset.theme==='light';
  for(const point of points){
   point.x+=point.vx*step;point.y+=point.vy*step;
   if(point.y<-4)point.y=height+4;
   if(point.x<-4)point.x=width+4;
   if(point.x>width+4)point.x=-4;
   ctx.beginPath();ctx.arc(point.x,point.y,point.r,0,Math.PI*2);
   ctx.fillStyle=light?'rgba(16,116,158,'+point.a+')':'rgba(41,169,218,'+point.a+')';ctx.fill();
  }
 }
 function tick(now){
  frame=0;
  if(document.hidden||reduced.matches)return;
  if(now-last>=33){draw(Math.min((now-last)/16.67,3));last=now}
  frame=requestAnimationFrame(tick);
 }
 function sync(){
  if(frame)cancelAnimationFrame(frame);frame=0;last=performance.now();
  if(reduced.matches){draw(0);return}
  if(!document.hidden)frame=requestAnimationFrame(tick);
 }
 addEventListener('resize',resize,{passive:true});
 document.addEventListener('visibilitychange',sync);
 reduced.addEventListener('change',sync);
 new MutationObserver(()=>draw(0)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
 resize();sync();
})();
