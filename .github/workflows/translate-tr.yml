name: Önce Türkçe mangayı üret

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/translate-tr.yml"
      - "tools/translate_chapters.py"

permissions:
  contents: write

concurrency:
  group: manga-translate-tr
  cancel-in-progress: true

jobs:
  translate_chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        chapter: ["1","2","3","4","5","5.1","5.5","6","7","8","9","10","10.1","10.2","10.5","11","12","12.5","13","14","15"]
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core fonts-noto-core fonts-noto-cjk libfribidi0 libraqm0

      - name: Python paketleri
        run: |
          python -m pip install --upgrade pip
          pip install pillow pytesseract argostranslate opencv-python-headless numpy

      - name: Bölümü Türkçeye çevir
        env:
          TARGET_LANGS: tr
          TARGET_CHAPTERS: ${{ matrix.chapter }}
        run: python tools/translate_chapters.py

      - name: Bölüm çıktısını sakla
        uses: actions/upload-artifact@v4
        with:
          name: tr-clean-${{ matrix.chapter }}
          path: tr-clean/${{ matrix.chapter }}.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: translate_chapter
    runs-on: ubuntu-latest
    steps:
      - name: En güncel repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tüm temiz Türkçe bölüm paketlerini indir
        uses: actions/download-artifact@v4
        with:
          pattern: tr-clean-*
          path: tr-clean
          merge-multiple: true

      - name: 21 Türkçe paketi doğrula
        run: |
          count=$(find tr-clean -maxdepth 1 -name '*.zip' | wc -l)
          echo "Türkçe paket sayısı: $count"
          test "$count" -eq 21

      - name: Temiz Türkçe paketleri siteye kaydet
        run: |
          git config user.name "ejdermanga-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git add tr-clean
          git commit -m "Mushoku Tensei 21 temiz Türkçe manga bölümünü yayınla"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
